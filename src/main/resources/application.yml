server:
  port: ${SERVER_PORT:18080}
  tomcat:
    max-http-post-size: 5MB
    max-swallow-size: 5MB

spring:
  application:
    name: qra-lia-backend
  jackson:
    default-property-inclusion: ALWAYS
  servlet:
    multipart:
      max-request-size: 5MB
      max-file-size: 5MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level requestId=%X{requestId:--} %logger{36} - %msg%n"

app:
  mock-ai: ${APP_MOCK_AI:false}
  timezone: Africa/Casablanca
  max-image-bytes: 3145728
  rate-limit-per-minute: 10
  ai-timeout-seconds: 15
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}
    base-url: https://api.groq.com/openai/v1
