<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d3fd8" />
    <title>Qra Lia — ما كاينش الأنترنت</title>
    <style>
      :root {
        --bg: #f5f7ff;
        --surface: #ffffff;
        --text: #0b1533;
        --muted: #4a5578;
        --border: #dce2f5;
        --primary: #1d3fd8;
        --primary-deep: #0c1f86;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #060b22;
          --surface: #0e1736;
          --text: #eef2ff;
          --muted: #a7b1d8;
          --border: #22305e;
          --primary: #3f63ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", "Geeza Pro", "Noto Sans Arabic", Tahoma, sans-serif;
        font-size: 20px;
        line-height: 1.7;
        text-align: center;
      }
      main {
        width: 100%;
        max-width: 440px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 32px 22px;
        box-shadow: 0 20px 50px rgba(12, 31, 134, 0.12);
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        margin: 0 auto 16px;
        display: block;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 6px;
        color: var(--muted);
      }
      .fr {
        direction: ltr;
        font-size: 16px;
      }
      button {
        margin-top: 20px;
        width: 100%;
        min-height: 60px;
        border: 0;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--primary), var(--primary-deep));
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>ما كاينش الأنترنت</h1>
      <p>Qra Lia محتاجة الأنترنت باش تقرا الورقة. تأكد من الويفي ولا الداتا وعاود.</p>
      <p class="fr" lang="fr">Pas de connexion. Qra Lia a besoin d'internet pour lire le document.</p>
      <button type="button" onclick="location.reload()">عاود جرّب · Réessayer</button>
    </main>
  </body>
</html>
