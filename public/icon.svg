<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Qra Lia app icon: a paper that talks to you. WhatsApp-like green, 3D paper + marigold speech bubble. -->
  <defs>
    <radialGradient id="bg" cx="0.34" cy="0.24" r="0.95">
      <stop offset="0" stop-color="#2BC79C"/>
      <stop offset="0.45" stop-color="#008069"/>
      <stop offset="1" stop-color="#005246"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#00261D" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="patternFade" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.25" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </radialGradient>
    <mask id="patternMask"><rect width="1024" height="1024" fill="url(#patternFade)"/></mask>
    <!-- Zellige: eight-point stars (two squares) on a 128px grid -->
    <pattern id="zellige" width="128" height="128" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#fff" stroke-width="3" stroke-opacity="0.13">
        <rect x="36" y="36" width="56" height="56"/>
        <rect x="36" y="36" width="56" height="56" transform="rotate(45 64 64)"/>
        <circle cx="64" cy="64" r="12"/>
        <path d="M0 0 L22 22 M128 0 L106 22 M0 128 L22 106 M128 128 L106 106"/>
      </g>
    </pattern>

    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#F3F5FB"/>
      <stop offset="1" stop-color="#E2E7F4"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C9D1E8"/>
      <stop offset="0.55" stop-color="#EEF1F9"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="bubble" x1="530" y1="570" x2="810" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFDB6E"/>
      <stop offset="0.5" stop-color="#F6B21A"/>
      <stop offset="1" stop-color="#E48A00"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="tightShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="barShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#A85F00" flood-opacity="0.45"/>
    </filter>

    <path id="paperShape" d="M330 230 H570 L660 320 V690 Q660 720 630 720 H330 Q300 720 300 690 V260 Q300 230 330 230 Z"/>
    <path id="bubbleShape" d="M600 580 H740 Q810 580 810 650 V720 Q810 790 740 790 H650 L575 850 L590 785 Q530 770 530 710 V650 Q530 580 600 580 Z"/>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#vignette)"/>
  <rect width="1024" height="560" fill="url(#sheen)"/>

  <g transform="translate(512 512) scale(0.93) translate(-555 -535)">
    <!-- Back sheet (a small stack of papers) -->
    <g transform="translate(34 -6) rotate(6 480 475)">
      <use href="#paperShape" transform="translate(16 30)" fill="#00241B" opacity="0.4" filter="url(#softShadow)"/>
      <use href="#paperShape" fill="#D9E0F4"/>
      <use href="#paperShape" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2"/>
    </g>
    <!-- Paper -->
    <g transform="rotate(-7 480 475)">
      <use href="#paperShape" transform="translate(26 44)" fill="#00241B" opacity="0.5" filter="url(#softShadow)"/>
      <use href="#paperShape" transform="translate(6 10)" fill="#00241B" opacity="0.35" filter="url(#tightShadow)"/>
      <use href="#paperShape" fill="url(#paper)"/>
      <use href="#paperShape" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2"/>
      <!-- folded corner -->
      <path d="M570 230 L660 320 H594 Q570 320 570 296 Z" fill="#0A1B6E" opacity="0.18" filter="url(#tightShadow)"/>
      <path d="M570 230 L660 320 H594 Q570 320 570 296 Z" fill="url(#fold)"/>
      <!-- printed content -->
      <rect x="340" y="276" width="150" height="28" rx="14" fill="#008069" opacity="0.9"/>
      <rect x="340" y="350" width="270" height="16" rx="8" fill="#C5CDE3"/>
      <rect x="340" y="388" width="230" height="16" rx="8" fill="#C5CDE3"/>
      <rect x="340" y="426" width="255" height="16" rx="8" fill="#C5CDE3"/>
      <rect x="340" y="476" width="160" height="58" rx="14" fill="#FFF3D1" stroke="#F6B21A" stroke-width="4"/>
      <rect x="360" y="498" width="96" height="16" rx="8" fill="#E39A00"/>
      <rect x="340" y="572" width="240" height="16" rx="8" fill="#C5CDE3"/>
      <rect x="340" y="610" width="170" height="16" rx="8" fill="#C5CDE3"/>
      <circle cx="600" cy="652" r="30" fill="none" stroke="#008069" stroke-opacity="0.35" stroke-width="5"/>
    </g>

    <!-- Speech bubble -->
    <use href="#bubbleShape" transform="translate(18 34)" fill="#002A20" opacity="0.55" filter="url(#softShadow)"/>
    <use href="#bubbleShape" transform="translate(4 10)" fill="#6B3A00" opacity="0.35" filter="url(#tightShadow)"/>
    <use href="#bubbleShape" fill="url(#bubble)"/>
    <use href="#bubbleShape" fill="none" stroke="#FFF1C2" stroke-opacity="0.7" stroke-width="3"/>
    <ellipse cx="668" cy="612" rx="118" ry="26" fill="url(#gloss)"/>
    <!-- sound wave -->
    <g fill="#FFFFFF" filter="url(#barShadow)">
      <rect x="578" y="665" width="24" height="40" rx="12"/>
      <rect x="618" y="645" width="24" height="80" rx="12"/>
      <rect x="658" y="628" width="24" height="114" rx="12"/>
      <rect x="698" y="645" width="24" height="80" rx="12"/>
      <rect x="738" y="665" width="24" height="40" rx="12"/>
    </g>
  </g>
</svg>
